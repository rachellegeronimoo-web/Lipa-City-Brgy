<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Service Details | Lipa City Barangay Services Guide</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ==========================================
           SERVICE DETAILS PAGE
        ========================================== */

        .service-details-page {
            padding: 70px 20px;
            background: #f7f5f0;
            min-height: 70vh;
        }

        .service-details-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #333;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .service-details-card {
            background: #ffffff;
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .service-category-label {
            display: inline-block;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #777;
        }

        .service-details-card h1 {
            margin: 0 0 20px;
            font-family: "Playfair Display", serif;
            font-size: 42px;
        }

        .service-description {
            font-size: 17px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 35px;
        }

        .details-section {
            border-top: 1px solid #e5e5e5;
            padding: 25px 0;
        }

        .details-section h2 {
            margin-bottom: 15px;
            font-size: 22px;
        }

        .details-section p {
            color: #555;
            line-height: 1.7;
        }

        .details-section ul {
            padding-left: 20px;
            line-height: 2;
            color: #555;
        }

        .service-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 10px;
        }

        .service-info-box {
            background: #f7f5f0;
            padding: 20px;
            border-radius: 10px;
        }

        .service-info-box span {
            display: block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        .service-info-box strong {
            font-size: 16px;
        }

        .request-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 24px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .request-button:hover {
            opacity: 0.85;
        }

        .service-not-found {
            text-align: center;
            padding: 60px 20px;
        }

        @media (max-width: 700px) {

            .service-details-card {
                padding: 25px;
            }

            .service-details-card h1 {
                font-size: 32px;
            }

            .service-info-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="main-header">

        <div class="header-container">

            <a href="index.html" class="brand">

                <div class="brand-symbol">
                    L
                </div>

                <div class="brand-text">

                    <strong>
                        LIPA CITY
                    </strong>

                    <span>
                        Barangay Services Guide
                    </span>

                </div>

            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="services.html" class="active">
                    Services
                </a>

                <a href="index.html#barangays">
                    Barangays
                </a>

                <a href="index.html#about">
                    About
                </a>

            </nav>


            <!-- ACCOUNT ACTIONS -->

            <div
                class="header-actions"
                id="accountActions"
            >

                <a
                    href="login.html"
                    class="login-link"
                >
                    Login
                </a>

                <a
                    href="register.html"
                    class="header-signup"
                >
                    Sign Up
                </a>

            </div>


            <button
                class="menu-button"
                id="menuButton"
                type="button"
            >
                ☰
            </button>

        </div>

    </header>



    <!-- ==================================================
         SERVICE DETAILS
    ================================================== -->

    <main class="service-details-page">

        <div class="service-details-container">

            <a
                href="services.html"
                class="back-link"
            >
                ← Back to Services
            </a>


            <div
                id="serviceContent"
                class="service-details-card"
            >

                <!-- JavaScript will insert the service here -->

            </div>

        </div>

    </main>



    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="main-footer">

        <div class="footer-container">

            <div class="footer-brand">

                <div class="footer-logo">
                    L
                </div>

                <div>

                    <strong>
                        LIPA CITY
                    </strong>

                    <span>
                        Barangay Services Guide
                    </span>

                </div>

            </div>


            <div class="footer-links">

                <a href="index.html">
                    Home
                </a>

                <a href="services.html">
                    Services
                </a>

                <a href="index.html#barangays">
                    Barangays
                </a>

                <a href="index.html#about">
                    About
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 Lipa Barangay Services Guide.
                Academic Project.
            </p>

            <p>
                Platform Technologies
            </p>

        </div>

    </footer>



    <!-- ==================================================
         FIREBASE AUTHENTICATION
    ================================================== -->

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
            from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyATdFREEFoy8-7A0Uox9DNXXO7qairhnts",

            authDomain:
                "lipabarangayservices.firebaseapp.com",

            projectId:
                "lipabarangayservices",

            storageBucket:
                "lipabarangayservices.firebasestorage.app",

            messagingSenderId:
                "995460316863",

            appId:
                "1:995460316863:web:ce4ad089a11d55730ad00a",

            measurementId:
                "G-2N9EDEC3ES"

        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        const accountActions =
            document.getElementById("accountActions");


        onAuthStateChanged(
            auth,
            function (user) {

                if (user) {

                    const displayName =
                        user.displayName ||
                        user.email ||
                        "User";


                    accountActions.innerHTML = `

                        <span class="login-link">
                            Welcome, ${displayName}
                        </span>

                        <button
                            type="button"
                            class="header-signup"
                            id="logoutButton"
                        >
                            Logout
                        </button>

                    `;


                    document
                        .getElementById("logoutButton")
                        .addEventListener(
                            "click",
                            async function () {

                                try {

                                    await signOut(auth);

                                    window.location.href =
                                        "index.html";

                                } catch (error) {

                                    console.error(
                                        "Logout error:",
                                        error
                                    );

                                }

                            }
                        );

                } else {

                    accountActions.innerHTML = `

                        <a
                            href="login.html"
                            class="login-link"
                        >
                            Login
                        </a>

                        <a
                            href="register.html"
                            class="header-signup"
                        >
                            Sign Up
                        </a>

                    `;

                }

            }
        );

    </script>



    <!-- ==================================================
         SERVICE DETAILS JS
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const serviceContent =
                    document.getElementById(
                        "serviceContent"
                    );


                /*
                 * Get the service from the URL.
                 *
                 * Example:
                 * service-details.html?service=clearance
                 */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const service =
                    params.get("service");


                /*
                 * SERVICE INFORMATION
                 */

                const services = {

                    clearance: {

                        category: "Documents",

                        title: "Barangay Clearance",

                        description:
                            "A barangay clearance is an official document issued by the barangay for employment, school, business, and other official requirements.",

                        availability:
                            "All Barangays",

                        location:
                            "Barangay Hall",

                        processing:
                            "Depends on the barangay",

                        requirements: [
                            "Valid government-issued ID",
                            "Proof of residency, if required",
                            "Completed application form"
                        ],

                        steps: [
                            "Visit your Barangay Hall.",
                            "Ask for the barangay clearance application form.",
                            "Submit the required documents.",
                            "Pay the applicable barangay fee, if required.",
                            "Wait for the clearance to be processed."
                        ]

                    },


                    certificate: {

                        category: "Documents",

                        title: "Barangay Certificate",

                        description:
                            "A barangay certificate is an official certification that may be requested for residency, indigency, and other official purposes.",

                        availability:
                            "All Barangays",

                        location:
                            "Barangay Hall",

                        processing:
                            "Depends on the barangay",

                        requirements: [
                            "Valid government-issued ID",
                            "Proof of residency, if required",
                            "Completed application form"
                        ],

                        steps: [
                            "Visit your Barangay Hall.",
                            "Request the appropriate barangay certificate.",
                            "Submit the required documents.",
                            "Pay the applicable fee, if required.",
                            "Receive your certificate."
                        ]

                    },


                    health: {

                        category: "Health",

                        title: "Barangay Health Center",

                        description:
                            "Barangay Health Centers provide basic health services and community health assistance to residents.",

                        availability:
                            "All Barangays",

                        location:
                            "Barangay Health Center",

                        processing:
                            "Depends on the service",

                        requirements: [
                            "Valid ID, if required",
                            "Barangay residency information",
                            "Health-related documents, if applicable"
                        ],

                        steps: [
                            "Visit your local Barangay Health Center.",
                            "Register or provide your basic information.",
                            "Tell the health worker the service you need.",
                            "Follow the instructions provided by the health staff."
                        ]

                    },


                    social: {

                        category: "Social Services",

                        title: "Social Assistance",

                        description:
                            "Information about community assistance and social support programs available to qualified residents.",

                        availability:
                            "All Barangays",

                        location:
                            "Barangay Hall",

                        processing:
                            "Depends on the assistance program",

                        requirements: [
                            "Valid government-issued ID",
                            "Proof of residency",
                            "Additional documents depending on the program"
                        ],

                        steps: [
                            "Visit your Barangay Hall.",
                            "Ask about available social assistance programs.",
                            "Submit the required documents.",
                            "Wait for the assessment or verification."
                        ]

                    },


                    community: {

                        category: "Community",

                        title: "Community Programs",

                        description:
                            "Information about barangay programs, activities, and community initiatives for residents.",

                        availability:
                            "All Barangays",

                        location:
                            "Barangay Hall",

                        processing:
                            "Depends on the program",

                        requirements: [
                            "Requirements vary depending on the program.",
                            "Barangay residency may be required."
                        ],

                        steps: [
                            "Visit your Barangay Hall.",
                            "Ask about current community programs.",
                            "Check the eligibility requirements.",
                            "Register or participate according to the program instructions."
                        ]

                    },


                    safety: {

                        category: "Safety",

                        title: "Barangay Safety Assistance",

                        description:
                            "Barangay safety assistance provides information and support regarding community safety and security concerns.",

                        availability:
                            "All Barangays",

                        location:
                            "Barangay Hall",

                        processing:
                            "Depends on the concern",

                        requirements: [
                            "Valid ID, if required",
                            "Basic information about the concern"
                        ],

                        steps: [
                            "Visit or contact your Barangay Hall.",
                            "Explain the safety concern.",
                            "Provide the necessary information.",
                            "Follow the instructions of the barangay personnel."
                        ]

                    }

                };


                /*
                 * CHECK IF SERVICE EXISTS
                 */

                if (
                    !service ||
                    !services[service]
                ) {

                    serviceContent.innerHTML = `

                        <div class="service-not-found">

                            <h1>
                                Service Not Found
                            </h1>

                            <p>
                                The service you are looking for
                                does not exist.
                            </p>

                            <a
                                href="services.html"
                                class="request-button"
                            >
                                Back to Services
                            </a>

                        </div>

                    `;

                    return;

                }


                const data =
                    services[service];


                /*
                 * CREATE REQUIREMENTS LIST
                 */

                const requirements =
                    data.requirements
                        .map(
                            function (item) {

                                return `
                                    <li>
                                        ${item}
                                    </li>
                                `;

                            }
                        )
                        .join("");


                /*
                 * CREATE STEPS LIST
                 */

                const steps =
                    data.steps
                        .map(
                            function (item) {

                                return `
                                    <li>
                                        ${item}
                                    </li>
                                `;

                            }
                        )
                        .join("");


                /*
                 * DISPLAY SERVICE
                 */

                serviceContent.innerHTML = `

                    <span class="service-category-label">
                        ${data.category}
                    </span>


                    <h1>
                        ${data.title}
                    </h1>


                    <p class="service-description">
                        ${data.description}
                    </p>


                    <div class="service-info-grid">

                        <div class="service-info-box">

                            <span>
                                AVAILABLE IN
                            </span>

                            <strong>
                                ${data.availability}
                            </strong>

                        </div>


                        <div class="service-info-box">

                            <span>
                                LOCATION
                            </span>

                            <strong>
                                ${data.location}
                            </strong>

                        </div>


                        <div class="service-info-box">

                            <span>
                                PROCESSING
                            </span>

                            <strong>
                                ${data.processing}
                            </strong>

                        </div>

                    </div>


                    <div class="details-section">

                        <h2>
                            Requirements
                        </h2>

                        <ul>
                            ${requirements}
                        </ul>

                    </div>


                    <div class="details-section">

                        <h2>
                            How to Avail
                        </h2>

                        <ol>
                            ${steps}
                        </ol>

                    </div>


                    <div class="details-section">

                        <h2>
                            Need this service?
                        </h2>

                        <p>
                            You can proceed to the service
                            request once the request feature
                            is connected.
                        </p>

                        <a
                            href="request-service.html?service=${service}"
                            class="request-button"
                        >
                            Request Service
                        </a>

                    </div>

                `;


                /*
                 * UPDATE PAGE TITLE
                 */

                document.title =
                    data.title +
                    " | Lipa City Barangay Services Guide";

            }
        );

    </script>


</body>

</html>
